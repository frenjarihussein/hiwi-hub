<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Yousef Soft</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{width:min(92vw,420px);background:#1e293b;border-radius:16px;padding:24px}
  h1{margin:0 0 6px;font-size:22px} p{margin:0 0 18px;color:#94a3b8;font-size:14px}
  button{width:100%;padding:14px;border:0;border-radius:10px;font-size:16px;margin-top:10px;background:#f59e0b;color:#111;font-weight:700}
  button.alt{background:#334155;color:#e2e8f0}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#e2e8f0;font-size:16px;direction:ltr;margin-top:10px}
  #lan{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>يوسف سوفت</h1>
  <p>اختر طريقة الاتصال. يُحفظ اختيارك ويمكن تغييره بإعادة تثبيت التطبيق أو مسح بياناته.</p>
  <button id="cloud">الخادم السحابي (عبر الإنترنت)</button>
  <button class="alt" id="showLan">خادم الشبكة الداخلية (جهاز الشركة)</button>
  <div id="lan">
    <input id="ip" placeholder="192.168.1.10:3000" />
    <button id="go">اتصال</button>
  </div>
</div>
<script>
  const CLOUD = "https://yousef-soft30.lovable.app/auth";
  const saved = localStorage.getItem("ys.server");
  const open = (u) => { localStorage.setItem("ys.server", u); location.replace(u); };
  if (saved && !location.hash.includes("choose")) location.replace(saved);
  document.getElementById("cloud").onclick = () => open(CLOUD);
  document.getElementById("showLan").onclick = () => { document.getElementById("lan").style.display = "block"; };
  document.getElementById("go").onclick = () => {
    let v = document.getElementById("ip").value.trim();
    if (!v) return;
    if (!/^https?:\/\//.test(v)) v = "http://" + v;
    if (!/:\d+/.test(v.replace(/^https?:\/\//, ""))) v += ":3000";
    open(v.replace(/\/$/, "") + "/auth");
  };
</script>
</body>
</html>
