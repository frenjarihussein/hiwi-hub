name: Build Android app

on:
  workflow_dispatch:
  push:
    tags: ["android-v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Build APK
        working-directory: desktop/src-tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          cargo install tauri-cli --version "^2.6" --locked
          cargo tauri icon ../../public/app-icon-512.png -o icons
          cargo tauri android init --ci --config tauri.android.conf.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path('gen/android/app/src/main/AndroidManifest.xml')
          content = p.read_text()
          if 'android:usesCleartextTraffic' not in content:
              content = content.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(content)
          PY
          cargo tauri android build --apk --ci --config tauri.android.conf.json --target aarch64

      - name: Sign release APK with persistent owner key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || { echo 'Configure the four Android signing secrets before releasing.'; exit 1; }
          mapfile -t APKS < <(find desktop/src-tauri/gen/android -name '*-unsigned.apk')
          test "${#APKS[@]}" = 1 || { echo 'Expected exactly one unsigned arm64 APK'; exit 1; }
          APK="${APKS[0]}"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/ys.jks"
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/zipalign -f 4 "$APK" aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/ys.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out YousefSoft.apk aligned.apk
          $BT/apksigner verify --verbose YousefSoft.apk
          rm "$RUNNER_TEMP/ys.jks"

      - uses: actions/upload-artifact@v5
        with:
          name: YousefSoft-Android
          path: YousefSoft.apk
          if-no-files-found: error
