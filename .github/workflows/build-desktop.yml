name: Build desktop installer

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PG_ZIP: https://get.enterprisedb.com/postgresql/postgresql-15.8-1-windows-x64-binaries.zip
      PGRST_ZIP: https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-windows-x64.zip
      NODE_ZIP: https://nodejs.org/dist/v20.18.0/node-v20.18.0-win-x64.zip
      AUTH_TAG: v2.164.0
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v6
        with: { go-version: "1.23", cache: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop/src-tauri }

      - name: Download PostgreSQL, PostgREST, Node
        run: |
          mkdir -p desktop/stack
          cd desktop/stack
          curl -fsSL "$PG_ZIP" -o pg.zip && unzip -q pg.zip && rm pg.zip
          rm -rf pgsql/pgAdmin* pgsql/doc pgsql/symbols pgsql/StackBuilder
          curl -fsSL "$PGRST_ZIP" -o rest.zip && unzip -q rest.zip && rm rest.zip
          curl -fsSL "$NODE_ZIP" -o node.zip && unzip -q node.zip && rm node.zip && mv node-v*-win-x64 node
          cp ../stack-src/hiwi-hub-schema-v2.sql .
          cp ../stack-src/local-compat.sql .
          echo '{"cmd":"./node/node.exe","args":["./app/server/index.mjs"]}' > app-cmd.json

      - name: Build GoTrue (sign-in service) for Windows
        run: |
          git clone --depth 1 --branch "$AUTH_TAG" https://github.com/supabase/auth.git /tmp/auth
          cd /tmp/auth && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$GITHUB_WORKSPACE/desktop/stack/gotrue.exe" .
          cp -r migrations "$GITHUB_WORKSPACE/desktop/stack/migrations"

      - name: Build app for local Node server
        env:
          NITRO_PRESET: node-server
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PROJECT_ID: local
          VITE_DESKTOP: "1"
          VITE_SUPABASE_PUBLISHABLE_KEY: local-runtime
        run: |
          bun install --frozen-lockfile
          bun run build
          test -f .output/server/index.mjs
          cp -r .output desktop/stack/app

      - name: Build launcher
        run: bun build --compile --target=bun-windows-x64 desktop/server/yousef-server.ts --outfile desktop/src-tauri/binaries/yousef-server-x86_64-pc-windows-msvc.exe

      - name: Build installer
        working-directory: desktop/src-tauri
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri icon ../../public/app-icon-512.png -o icons
          cargo tauri build

      - uses: actions/upload-artifact@v5
        with:
          name: YousefSoft-Setup
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
